command:
  - npm
  - run
  - start
env:
  - name: APP_MODE
    value: databricks
  - name: APP_NAME
    value: "ConsentMax analytics"
  - name: APP_DESCRIPTION
    value: "Dashboard ConsentMax — suivi du consentement et contribution Alliance"
  - name: APP_SUPPORT_NAME
    value: "richard.hooft"
  - name: APP_SUPPORT_SLACK_URL
    value: "https://valiuz.slack.com/team/richard.hooft"
  - name: DATABRICKS_SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DATABRICKS_CATALOG
    value: "prd-consent"
  - name: DATABRICKS_SCHEMA
    value: "analytics"
  - name: LOG_LEVEL
    value: info
  - name: USER_STATE_ENABLED
    value: "false"
  - name: USER_STATE_ORIGIN
    value: ""
  - name: USER_STATE_NAMESPACE
    value: "dev"
