bundle:
  name: "analytics-dbx-app-consentmax"
  databricks_cli_version: ">= 0.295.0"

include:
  - resources/*.yml

variables:
  app_name:
    default: "analytics-dbx-app-consentmax"
  app_description:
    default: "Dashboard ConsentMax — suivi du consentement et contribution Alliance"
  sql_warehouse_id:
    default: ab362e9710498a08
  git_repo_url:
    default: "https://github.com/rihovlz/analytics_dbx_app_consentmax"
  git_commit:
    description: Exact Git commit deployed by the production workflow
    default: "0000000000000000000000000000000000000000"
  can_use_group:
    default: "users"
  can_manage_group:
    default: "admins"
  prod_root_path:
    default: "/Workspace/Shared/.bundle/analytics-dbx-app-consentmax/prod"

targets:
  dev:
    default: true
    mode: development
    resources:
      apps:
        app:
          source_code_path: .
  prod:
    mode: production
    workspace:
      host: https://3070470996474403.3.gcp.databricks.com
      root_path: ${var.prod_root_path}
    resources:
      apps:
        app:
          git_repository:
            provider: gitHub
            url: ${var.git_repo_url}
          git_source:
            commit: ${var.git_commit}
