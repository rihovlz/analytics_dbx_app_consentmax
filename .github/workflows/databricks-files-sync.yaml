name: Databricks files sync

# Publie une copie consultable du dépôt dans le workspace Databricks.
#
# Déclenchement manuel uniquement. Une synchronisation purge puis republie
# l'intégralité du dépôt sur chaque environnement : la lancer à chaque push
# serait disproportionné pour une copie de consultation.
#
# Prérequis dans l'application enfant :
#  1. Environments agora et citadelle déclarés dans .github/settings.yml
#  2. Secrets DATABRICKS_HOST et DATABRICKS_TOKEN posés sur chaque environment
#
# La copie atterrit dans /valiuz-repos/<nom-du-repo>/<version>. Ce chemin est
# purgé avant chaque synchronisation : ne rien y stocker d'autre.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sous-dossier de destination dans le workspace"
        required: false
        default: "dev"
        type: choice
        options:
          - dev
          - stg
          - prd

jobs:
  sync-files:
    name: Sync repository files
    uses: valiuz/github_common_databricks/.github/workflows/deploy-databricks-files-any.yaml@main
    with:
      path_prefix: "valiuz-repos"
      environment_list: "['agora','citadelle']"
      repo_name: ${{ github.event.repository.name }}
      version: ${{ inputs.version }}
      files_directory: "."
      exclude_paths: "node_modules dist build coverage .next"
    secrets: inherit
