schemaVersion: 1
template:
  id: valiuz/analytics_dbx_app_template
  repository: https://github.com/valiuz/analytics_dbx_app_template
  currentVersion: 1.4.0
requirements:
  node: ">=22.16 <23"
  databricksCli: ">=0.295.0"
versions:
  "1.0.0":
    sourceCommit: 05d914c6863c92304b1bc662e40c17e0f97b2c29
    summary: Baseline du template avant les améliorations de compatibilité du 30 août 2026.
    capabilities:
      - guided-app-workflow
      - declared-data-access
      - optional-data-preparation
      - valiuz-app-shell
      - databricks-app-bundle
  "1.1.0":
    sourceCommit: 5df063bd0dc7b3664f1bf2cbe624119ddf5568ac
    summary: Compatibilité Databricks renforcée, parcours consommateur propre et suivi de version du template.
    extends: 1.0.0
    capabilities:
      - databricks-deployment-compatibility
      - clean-template-consumer-journey
      - template-version-tracking
  "1.2.0":
    sourceCommit: a1ed6bc333c8b8355641b17f74fe3ed0fb200815
    summary: Historisation à coût borné et gouvernance automatique des versions et de la documentation.
    extends: 1.1.0
    capabilities:
      - cost-aware-data-history
      - feature-release-governance
  "1.3.0":
    sourceCommit: 08058f189790546146dabec88a6a0897568b55e9
    summary: Composants de visualisation analytics réutilisables, accessibles et compatibles clair/sombre.
    extends: 1.2.0
    capabilities:
      - reusable-analytics-visualizations
  "1.4.0":
    sourceCommit: 19ade7c5882aeb3065453e0aaf3c02552a61fd6c
    summary: Assistant Genie conversationnel avec OBO, contexte de dashboard, résultats riches et épinglage composable.
    extends: 1.3.0
    capabilities:
      - genie-natural-language-analytics
capabilities:
  guided-app-workflow:
    since: 1.0.0
    description: Initialise, cadre et génère une première tranche verticale d'application.
    probes:
      - type: file
        path: scripts/init-app.mjs
      - type: file
        path: scripts/app-guide.mjs
      - type: file
        path: scripts/new-feature.mjs
  declared-data-access:
    since: 1.0.0
    description: Déclare les sources Unity Catalog et génère les bindings en lecture seule.
    probes:
      - type: file
        path: config/data-access.json
      - type: file
        path: scripts/data-access.mjs
      - type: file
        path: resources/data-access.generated.yml
  optional-data-preparation:
    since: 1.0.0
    description: Prend en charge les modes direct, notebook et pipeline dans un bundle data séparé.
    probes:
      - type: file
        path: data/databricks.yml
      - type: file
        path: scripts/init-data.mjs
      - type: file
        path: scripts/data-preparation.mjs
  valiuz-app-shell:
    since: 1.0.0
    description: Fournit le shell partagé et les médias officiels Valiuz.
    probes:
      - type: file
        path: src/components/app-shell/app-shell.tsx
      - type: file
        path: public/valiuz-logo-icon.svg
      - type: file
        path: public/favicon.svg
  databricks-app-bundle:
    since: 1.0.0
    description: Déploie l'application avec un manifest runtime unique et un Databricks Asset Bundle.
    probes:
      - type: file
        path: app.yaml
      - type: file
        path: databricks.yml
      - type: file
        path: scripts/deploy.mjs
  databricks-deployment-compatibility:
    since: 1.1.0
    description: Couvre les sorties CLI 1.x, les catalogues avec tirets, le bundle unique et le build sans variables runtime.
    probes:
      - type: fileContains
        path: scripts/check-databricks.ts
        text: export function parseDatabricksCliHost
      - type: fileContains
        path: src/features/readiness/server/repository.ts
        text: quoteQualifiedIdentifier(source.fullName)
      - type: fileNotContains
        path: databricks.yml
        text: "\nresources:\n  apps:"
      - type: fileContains
        path: resources/data-access.generated.yml
        text: "      name: ${var.app_name}"
      - type: fileContains
        path: src/app/page.tsx
        text: parseAppDisplayConfig
      - type: packageScript
        name: bundle:compatibility
        command: node --import tsx scripts/validate-bundle-cli.ts
  clean-template-consumer-journey:
    since: 1.1.0
    description: Valide une application générée depuis une copie Git propre jusqu'au build de production.
    probes:
      - type: file
        path: scripts/validate-template-journey.ts
      - type: packageScript
        name: template:journey
        command: node --import tsx scripts/validate-template-journey.ts
      - type: fileContains
        path: .github/workflows/ci.yml
        text: npm run template:journey
  template-version-tracking:
    since: 1.1.0
    description: Expose la version source, les capabilities vérifiées et les guides de mise à niveau.
    probes:
      - type: file
        path: template/manifest.yml
      - type: file
        path: scripts/template-manifest.mjs
      - type: file
        path: scripts/template-status.mjs
      - type: packageScript
        name: template:status
        command: node scripts/template-status.mjs
      - type: packageScript
        name: template:check
        command: node scripts/template-status.mjs --check
      - type: packageScript
        name: template:diff
        command: node scripts/template-status.mjs --diff
  cost-aware-data-history:
    since: 1.2.0
    description: Génère et exécute des reprises Databricks bornées avec validation avant remplacement atomique.
    probes:
      - type: file
        path: .agents/skills/design-cost-aware-data-history/SKILL.md
      - type: fileContains
        path: scripts/data-preparation.mjs
        text: output retention and finalization lag exceed source retention
      - type: fileContains
        path: scripts/init-data.mjs
        text: CREATE OR REPLACE TEMP TABLE
      - type: fileContains
        path: scripts/init-data.mjs
        text: REPLACE WHERE
      - type: fileContains
        path: scripts/run-data-preparation.mjs
        text: Bounded replay commands require both --start-date and --end-date.
      - type: fileContains
        path: scripts/run-data-preparation.mjs
        text: --deployment_fingerprint
      - type: fileContains
        path: scripts/preview-real.mjs
        text: preview:real cannot choose replay dates for bounded datasets
      - type: fileContains
        path: scripts/validate-bundle-cli.ts
        text: assertDataBundleContract
      - type: packageScript
        name: data:replay
        command: node scripts/run-data-preparation.mjs --run-only
  feature-release-governance:
    since: 1.2.0
    description: Impose après chaque feature une décision SemVer, un guide de migration et une revue documentaire.
    probes:
      - type: file
        path: .agents/skills/prepare-template-release/SKILL.md
      - type: fileContains
        path: AGENTS.md
        text: prepare-template-release
      - type: fileContains
        path: .agents/skills/review-analytics-app-docs/SKILL.md
        text: Lorsqu'une évolution de code est déjà autorisée
      - type: packageScript
        name: template:release:check
        command: node scripts/check-template-release.mjs
      - type: fileContains
        path: .github/workflows/ci.yml
        text: npm run template:release:check
  reusable-analytics-visualizations:
    since: 1.3.0
    description: Fournit des KPI, graphiques et cartes composables, accessibles, avec états explicites et modes clair/sombre.
    probes:
      - type: fileContains
        path: src/components/data-visualization/index.ts
        text: DataCard
      - type: fileContains
        path: src/components/data-visualization/index.ts
        text: BigNumberKPI
      - type: fileContains
        path: src/components/data-visualization/index.ts
        text: MiniAreaChart
      - type: fileContains
        path: src/components/data-visualization/index.ts
        text: CircularProgress
      - type: fileContains
        path: src/components/data-visualization/index.ts
        text: MultiMetricCard
      - type: fileContains
        path: src/components/data-visualization/index.ts
        text: TimeSeriesChart
      - type: fileContains
        path: src/components/data-visualization/index.ts
        text: AnalyticsMap
      - type: file
        path: src/app/visualizations/page.tsx
      - type: fileContains
        path: src/app/globals.css
        text: ':root[data-theme="dark"]'
  genie-natural-language-analytics:
    since: 1.4.0
    description: Ajoute un chat Genie OBO réutilisable, des résultats riches, le contexte de dashboard et des cartes épinglables.
    probes:
      - type: file
        path: config/genie-spaces.json
      - type: file
        path: src/features/genie/genie-chat.tsx
      - type: file
        path: src/features/genie/server/service.ts
      - type: fileContains
        path: src/features/genie/server/identity.ts
        text: x-forwarded-access-token
      - type: file
        path: src/app/api/genie/[alias]/messages/route.ts
      - type: file
        path: src/app/genie/page.tsx
      - type: fileContains
        path: scripts/data-access.mjs
        text: validateGenieEnvironmentReferences
      - type: fileContains
        path: resources/data-access.generated.yml
        text: "        - genie"
      - type: fileContains
        path: resources/data-access.generated.yml
        text: "          genie_space:"
      - type: fileContains
        path: resources/data-access.generated.yml
        text: "            permission: CAN_RUN"
      - type: packageScript
        name: test:e2e
        command: playwright test
upgrades:
  - from: 1.0.0
    to: 1.1.0
    path: template/upgrades/1.0.0-to-1.1.0.yml
  - from: 1.1.0
    to: 1.2.0
    path: template/upgrades/1.1.0-to-1.2.0.yml
  - from: 1.2.0
    to: 1.3.0
    path: template/upgrades/1.2.0-to-1.3.0.yml
  - from: 1.3.0
    to: 1.4.0
    path: template/upgrades/1.3.0-to-1.4.0.yml
