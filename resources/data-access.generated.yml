# Generated by npm run data:access:render. Do not edit directly.
resources:
  apps:
    app:
      name: ${var.app_name}
      description: ${var.app_description}
      compute_size: MEDIUM
      permissions:
        - group_name: ${var.can_manage_group}
          level: CAN_MANAGE
        - group_name: ${var.can_use_group}
          level: CAN_USE
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
